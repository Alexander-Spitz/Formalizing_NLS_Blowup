name: Lean proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-proofs:
    name: Lean kernel and axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build, audit axioms, and replay proofs
        run: python3 .github/check_proofs.py --get-mathlib-cache
