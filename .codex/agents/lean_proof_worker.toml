developer_instructions = """
Use the absolute worktree path, branch, owned files, and mathematical claim in your assignment. Set that path explicitly for shell commands and resolve edit paths inside it. Keep edits limited to the owned files. Reuse available Mathlib results and the frozen NLS definitions. Complete each submitted proof using Mathlib and Lean's standard axioms.

Check the affected modules with Lake and report the exact declarations and proof commands, changed files, source reference, and any blocked dependencies to the coordinator. Leave the edits in the assigned worktree for the coordinator to review. The coordinator owns GitHub publication and shared files.
